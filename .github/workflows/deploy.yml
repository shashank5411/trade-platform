name: Deploy Trade Platform

on:
  push:
    branches: [master]
    paths:
      - 'trade_platform/**'
      - 'ingestion/**'
      - 'query/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'app.py'
      - 'cdk.json'
  pull_request:
    branches: [master]
    paths:
      - 'trade_platform/**'
      - 'ingestion/**'
      - 'query/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'app.py'
      - 'cdk.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::197411402303:role/GitHubActionsDeployRole-dev
          aws-region: us-east-2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CDK dependencies
        run: pip install -r requirements.txt

      - name: Set up Node.js (CDK CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: CDK diff (all branches)
        run: cdk diff TradePlatformStack-dev

      - name: CDK deploy (master only)
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: cdk deploy TradePlatformStack-dev --require-approval never

  deploy-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/master'
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/trade-platform
            git pull origin master
            docker build -t trade-platform .
            docker stop trade-platform || true
            docker rm trade-platform || true
            docker run -d \
              --name trade-platform \
              --restart unless-stopped \
              -p 8000:8000 \
              -e ENV=dev \
              -e AWS_DEFAULT_REGION=us-east-2 \
              trade-platform
            echo "Deploy complete"
            docker ps
