# ── Known eval-design findings (not system bugs) — 2026-06-21 baseline run ──
# First trustworthy run (after fixing tool-attribution instrumentation) scored
# 20/23. All three failures traced to eval-design gaps, not real system bugs:
#
#   GROUND-MARKET-001 — expected market-only, got macro+filings sequential.
#     The system correctly avoided having MarketAgent confabulate a cause
#     (which MARKET_SYSTEM explicitly forbids) and instead routed event-
#     causation to FilingsAgent, citing real Fed documents. Tripped the
#     forbidden_phrases check on "driven by" — but the phrase was legitimately
#     sourced, not hallucinated. Question/check needs updating to allow
#     causal language when explicitly cited from a document, not banned outright.
#
#   GROUND-SENTIMENT-001 — expected sentiment-only, got sentiment+filings.
#     FilingsAgent added financial-metrics context (net income, assets) —
#     reasonable enrichment, not wrong, just broader than the test assumed.
#     Also tripped forbidden_phrases on "lost confidence" — but the answer
#     used the phrase to REJECT the framing ("the evidence does not support
#     that conclusion"), not assert it. forbidden_phrases checking is naive
#     substring matching with no negation awareness — a real limitation of
#     score_grounding, not a system bug.
#
#   GROUND-MACRO-SENTIMENT-001 — same sentiment+filings pattern as above,
#     no forbidden phrase hit, passed grounding_pass but failed routing_pass
#     against an expected_agents list that was probably too narrow for what
#     a good answer actually requires.
#
# Action needed eventually (not blocking): make score_grounding negation-
# aware, or scope forbidden_phrases checks to "asserted without citation"
# rather than "phrase appears anywhere." Revisit when building out the
# grounding-layer judge call rather than relying on pure string matching.

