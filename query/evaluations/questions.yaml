      separate runs of this same question text — eval harness
      (stateless): [market] alone. CLI, memory-enabled: [market,
      sentiment]. CLI, --no-memory (same stateless condition as eval,
      exact same phrasing): [market, sentiment, filings]. Three
      different agent sets under three conditions, no single clean
      explanation isolated (not pure phrasing, not pure memory-state).
