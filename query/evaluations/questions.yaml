      another literal-phrase attempt. One observation (a 3-agent CLI run)
      produced a borderline intermediate-agent statement ("risk-tolerant
      investors may see this as a buying opportunity") that did NOT
      survive into the final synthesized answer — Synthesis Reflexion
      independently caught and corrected an unrelated fabricated-
      causation issue in that same run, suggesting existing guardrails
