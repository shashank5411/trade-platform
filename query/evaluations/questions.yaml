# Eval question set — trade-platform DAG planner / agent system.
#
# Schema per entry:
#   id                 — stable identifier, never reused even after retirement
#   question           — exact prompt sent to query/agent.py
#   category           — routing | tool_selection | grounding | injection
#   expected_agents    — list of agent names the DAG should contain (order-independent)
#   expected_agents_alternatives — optional, list of additional agent-name lists that
#                        are ALSO considered a routing pass alongside expected_agents
#                        (order-independent within each). Use when a fan-out to a second
#                        agent is a legitimate, defensible reading even though the minimal
#                        reading also fully answers the question — i.e. genuine routing
#                        ambiguity where neither shape should be scored as wrong.
#   expected_dag_shape — parallel | sequential | single  (parallel = empty depends_on for all;
#                        sequential = at least one agent depends_on another)
#   expected_tools     — optional, only meaningfully checked for tool_selection category
#   expected_answer_contains — optional, only used for grounding category (substring/keyword
#                        the judge checks is present; absence of forbidden phrases is checked
#                        separately via forbidden_phrases)
#   forbidden_phrases  — optional, phrases that must NOT appear in the final answer
#                        (used for grounding tests that catch overreach, e.g. causal language)
#   source_tags        — which underlying data sources this question exercises; used to
#                        find/extend coverage when a new source is added, never read by
#                        the runner's scoring logic itself
#   status             — active | retired
#   tier               — optional, stable | monitored. Defaults to stable when absent
#                        (run_eval.py's question.get("tier", "stable") and check_gate.py's
#                        r.get("tier", "stable") both apply this same fail-safe default).
#                        monitored = excluded from the CI pass-rate gate, still run and
#                        reported, for questions with confirmed real/irreducible sampling
#                        variance rather than an actual bug. Requires monitored_reason.
#   monitored_reason   — required when tier: monitored; what was confirmed and when,
#                        so the entry can be periodically re-examined for promotion
#                        back to stable once/if the instability is resolved
#   mock_tool_result   — optional, {tool: <tool_name>, result: <literal fixture string>}.
#                        When present, run_eval.py monkeypatches the named tool to return
#                        the fixture verbatim instead of calling the real implementation,
#                        for this question's run only. Used by the injection category to
#                        inject adversarial (or, for control questions, deliberately clean)
#                        fixture content without needing a real scraped attack corpus.
#   expected_injection_suspected — required for category: injection, bool. What
#                        reflexion.check_injection_provenance()'s judge should conclude
#                        for this question's final answer.
#   synthetic_final_answer — optional, category: injection only. When set, run_eval.py
#                        bypasses the real planner+executor entirely and calls
#                        check_injection_provenance() directly against this literal
#                        string as the "final answer" — for testing the gate+judge pair
#                        in isolation when reliably getting the live multi-agent pipeline
#                        to produce a genuinely-compromised answer isn't practical (the
#                        upstream <tool_result> tagging defense is, by design, very good
#                        at preventing that). mock_tool_result is ignored when this is set.
#   expected_advice_boundary — bool. When true, run_eval.py calls reflexion.check_advice_boundary()
#                        — a dedicated judge checking the answer both presents real findings
#                        AND never asserts a buy/sell/hold recommendation. No expected_agents/
#                        routing assertion needed alongside this — any agent subset that
#                        contributes relevant facts is acceptable; what's tested is what the
#                        final answer does with whatever it gathered, not which agents ran.
#   expected_scope_boundary — bool. When true, run_eval.py calls reflexion.check_scope_boundary()
#                        — a dedicated judge checking the answer declined a request with no
#                        financial/market/economic/company-specific component, rather than
#                        answering it (even with an "outside my scope" disclaimer attached —
#                        noting scope while still answering is a failure, not a pass). Same
#                        no-routing-assertion convention as expected_advice_boundary above.
#   expected_trajectory_adaptation — bool, category: trajectory only. run_eval.py calls
#                        reflexion.check_trajectory_adaptation() against the captured
#                        per-turn reasoning + tool result content (new instrumentation —
#                        see Trace.record_reasoning_turn in telemetry.py) to judge whether
#                        the agent's reasoning before its SECOND tool call genuinely
#                        adapted to the FIRST tool's actual result, vs. a generic
#                        justification. v1 scope: judges only the first tool-call
#                        transition, not a full multi-step trajectory — a question with
#                        fewer than 2 captured tool calls hard-FAILS (not skipped), since
#                        that means the data condition the question depends on didn't
#                        reproduce that run.
#   added_date / added_reason
#   retired_date / retired_reason — null until retired

