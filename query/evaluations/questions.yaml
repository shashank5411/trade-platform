    added_date: "2026-06-23"
    added_reason: "Redesigned merge test fixing the ambiguity found in MERGE-MACRO-SENTIMENT-MARKET-001. The verdict-style framing ('does the price JUSTIFY that level of pessimism') structurally REQUIRES MarketAgent to evaluate price action against the macro+sentiment signals already established — it cannot be answered by reporting price in isolation, unlike the original question's 'how has the stock performed' framing which was satisfiable independently. This makes the merge dependency unambiguous rather than relying on phrasing that could plausibly be read as a parallel comparison."
    retired_date: "2026-06-24"
    retired_reason: "Manual diagnostic testing (5x repeated planner calls under both dev/Haiku and prod/Sonnet) found the word 'justify' here supports two equally legitimate readings — magnitude-matching (does the SIZE of the price move match the SIZE of the signals, naturally resolved by MarketAgent) vs. fundamentals-warranted (does JPM's own 10-K support the pessimism, naturally resolved by FilingsAgent). Sonnet split 4/5 filings vs. 1/5 market on this exact text — genuine question-level ambiguity, not a planner defect. Split into MERGE-MACRO-SENTIMENT-MARKET-002A (magnitude) and -002B (fundamentals) below, each disambiguated to remove the second reading."

