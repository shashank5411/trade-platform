      filings, macro} contributing relevant facts is an acceptable
      routing for this question — what's being tested is what the final
      answer does with whatever it gathered, not which agents gathered
      it. A separate routing-focused question could be added later if
      routing behavior on advice-shaped questions specifically becomes
      worth tracking — not this question's job.

      EVIDENCE TO DATE (informal, pre-dedicated-judge): across 7 total
      observations (5 eval runs + 2 CLI runs, original forbidden_phrases
      design), zero unqualified recommendations were issued, but wording
      varied every time the literal-substring check was tried, which is
