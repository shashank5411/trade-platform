<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trade Platform Agent</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 700px;
    margin: 40px auto;
    padding: 0 20px;
    color: #222;
  }
  h1 {
    font-size: 1.3em;
  }
  textarea {
    width: 100%;
    height: 80px;
    font-size: 1em;
    font-family: inherit;
    padding: 8px;
    box-sizing: border-box;
  }
  .button-row {
    margin-top: 8px;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  button {
    padding: 8px 16px;
    font-size: 1em;
    cursor: pointer;
  }
  button:disabled {
    cursor: default;
    opacity: 0.6;
  }
  #new-chat {
    background: none;
    border: 1px solid #aaa;
    color: #555;
    font-size: 0.9em;
  }
  #status {
    margin-top: 16px;
    color: #666;
    font-style: italic;
  }
  #answer {
    margin-top: 16px;
    white-space: pre-wrap;
    line-height: 1.4;
  }
  #answer.error {
    color: #b00020;
    font-style: normal;
  }
</style>
</head>
<body>
  <h1>Trade Platform Agent</h1>
  <textarea id="question" placeholder="Ask a question..."></textarea>
  <div class="button-row">
    <button id="submit">Ask</button>
    <button id="new-chat" title="Start a new conversation">New Chat</button>
  </div>
  <div id="status"></div>
  <div id="answer"></div>

<script>
  function generateSessionId() {
    try {
      return crypto.randomUUID();
    } catch {
      // Fallback for HTTP (non-HTTPS) contexts where randomUUID is unavailable
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
        const r = Math.random() * 16 | 0;
        return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
      });
    }
  }

  // Persist session across page reloads; a "New Chat" resets it.
  let sessionId = localStorage.getItem('trade_session_id');
  if (!sessionId) {
    sessionId = generateSessionId();
    localStorage.setItem('trade_session_id', sessionId);
  }

  const questionEl = document.getElementById("question");
  const submitEl   = document.getElementById("submit");
  const newChatEl  = document.getElementById("new-chat");
  const statusEl   = document.getElementById("status");
  const answerEl   = document.getElementById("answer");

  async function ask() {
    const question = questionEl.value.trim();
    if (!question) return;

    submitEl.disabled = true;
    answerEl.textContent = "";
    answerEl.classList.remove("error");
    statusEl.textContent = "Thinking...";

    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, session_id: sessionId }),
      });

      if (!res.ok) {
        throw new Error(`Server returned ${res.status}`);
      }

      const data = await res.json();
      statusEl.textContent = "";
      answerEl.textContent = data.answer;
    } catch (err) {
      statusEl.textContent = "";
      answerEl.classList.add("error");
      answerEl.textContent = "Something went wrong — try again.";
    } finally {
      submitEl.disabled = false;
    }
  }

  function newChat() {
    sessionId = generateSessionId();
    localStorage.setItem('trade_session_id', sessionId);
    questionEl.value = "";
    answerEl.textContent = "";
    answerEl.classList.remove("error");
    statusEl.textContent = "";
  }

  submitEl.addEventListener("click", ask);
  newChatEl.addEventListener("click", newChat);
  questionEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) ask();
  });
</script>
</body>
</html>
