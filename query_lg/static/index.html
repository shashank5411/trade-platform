<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<title>Trade Platform — LangGraph</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:         #eef1f6;
    --surface:    #fcfdfe;
    --border:     #d3dae6;
    --text:       #171a21;
    --muted:      #6b7591;
    --accent:     #2563eb;
    --accent-bg:  #e4ecfd;
    --user-bg:    #e4ecfd;
    --user-border:#b8cdf7;
    --asst-bg:    #ffffff;
    --asst-border:#dde2ee;
    --clarify-bg: #fff7e6;
    --clarify-border: #f0c869;
    --sans:       'Sora', system-ui, sans-serif;
    --mono:       'JetBrains Mono', 'Fira Code', monospace;
  }

  html, body { height: 100%; }

  body {
    font-family: var(--sans);
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  .main-header { padding: 14px 24px; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; }
  .main-header-left { display: flex; flex-direction: column; }
  .main-header-title { font-size: 14px; font-weight: 700; color: var(--text); }
  .main-header-badge { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
  .main-header-sid { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 2px; }
  .btn-new-chat { padding: 8px 14px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-size: 12.5px; font-family: var(--sans); cursor: pointer; font-weight: 500; transition: background 0.15s; }
  .btn-new-chat:hover { background: #1d4ed8; }

  .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; flex-direction: column; max-width: 80%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }
  .msg-role { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; padding: 0 4px; }
  .msg-bubble { padding: 12px 16px; border-radius: 10px; line-height: 1.6; font-size: 13.5px; word-break: break-word; }
  .msg.user .msg-bubble { background: var(--user-bg); border: 1px solid var(--user-border); border-bottom-right-radius: 3px; color: #1e3a8a; white-space: pre-wrap; }
  .msg.assistant .msg-bubble { background: var(--asst-bg); border: 1px solid var(--asst-border); border-bottom-left-radius: 3px; color: var(--text); }
  .msg.assistant .msg-bubble.error { color: #991b1b; background: #fee2e2; border-color: #fca5a5; }
  .msg.assistant .msg-bubble.clarify { background: var(--clarify-bg); border-color: var(--clarify-border); }

  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); gap: 8px; padding: 40px; }
  .empty-state-text { font-size: 14px; font-weight: 500; }
  .empty-state-sub  { font-size: 12px; }

  .typing { display: flex; gap: 4px; padding: 14px 16px; background: var(--asst-bg); border: 1px solid var(--asst-border); border-radius: 10px; border-bottom-left-radius: 3px; width: fit-content; }
  .typing span { width: 6px; height: 6px; background: var(--muted); border-radius: 50%; animation: bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,80%,100%{transform:translateY(0);opacity:0.4} 40%{transform:translateY(-5px);opacity:1} }

  .clarify-banner { align-self: flex-start; font-size: 11px; color: #92620a; background: var(--clarify-bg); border: 1px solid var(--clarify-border); border-radius: 6px; padding: 6px 10px; margin-top: -8px; }

  .input-area { padding: 16px 24px; border-top: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
  .input-row { display: flex; gap: 10px; align-items: flex-end; max-width: 900px; margin: 0 auto; }
  textarea { flex: 1; padding: 10px 14px; font-size: 13.5px; font-family: var(--sans); border: 1px solid var(--border); border-radius: 8px; resize: none; height: 44px; min-height: 44px; max-height: 160px; line-height: 1.5; color: var(--text); background: var(--bg); transition: border-color 0.15s; overflow-y: hidden; }
  textarea:focus { outline: none; border-color: var(--accent); }
  .btn-send { padding: 10px 20px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 13.5px; font-family: var(--sans); font-weight: 500; cursor: pointer; height: 44px; flex-shrink: 0; transition: background 0.15s; }
  .btn-send:hover { background: #1d4ed8; }
  .btn-send:disabled { opacity: 0.5; cursor: default; }
  .input-hint { font-size: 11px; color: var(--muted); text-align: center; margin-top: 8px; }

  .msg-bubble * { margin: 0; padding: 0; }
  .msg-bubble h1,.msg-bubble h2,.msg-bubble h3 { font-size: 14px; font-weight: 700; margin-top: 10px; margin-bottom: 2px; }
  .msg-bubble p { line-height: 1.55; margin-top: 4px; }
  .msg-bubble p:first-child { margin-top: 0; }
  .msg-bubble ul,.msg-bubble ol { margin-top: 4px; margin-bottom: 4px; padding-left: 18px; }
  .msg-bubble li { line-height: 1.55; margin-top: 2px; }
  .msg-bubble li:first-child { margin-top: 0; }
  .msg-bubble strong { font-weight: 700; }
  .msg-bubble em { font-style: italic; }
  .msg-bubble table { border-collapse: collapse; font-size: 12.5px; margin: 8px 0; width: 100%; }
  .msg-bubble th,.msg-bubble td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .msg-bubble th { background: var(--bg); font-weight: 600; font-size: 11.5px; }
  .msg-bubble code { font-family: var(--mono); font-size: 12px; background: var(--bg); padding: 1px 5px; border-radius: 3px; border: 1px solid var(--border); }
</style>
</head>
<body>

<div class="main-header">
  <div class="main-header-left">
    <div class="main-header-title">Trade Platform <span class="main-header-badge">LangGraph</span></div>
    <div class="main-header-sid" id="header-sid"></div>
  </div>
  <button class="btn-new-chat" onclick="newChat()">+ New Chat</button>
</div>

<div class="messages" id="messages">
  <div class="empty-state" id="empty-state">
    <div class="empty-state-text">Ask a question to get started</div>
    <div class="empty-state-sub">query_lg — plan-and-execute graph, market · macro · filings · sentiment</div>
  </div>
</div>

<div class="input-area">
  <div class="input-row">
    <textarea id="question" placeholder="Ask about markets, macro, filings, insider activity…" rows="1"></textarea>
    <button class="btn-send" id="submit">Send</button>
  </div>
  <div class="input-hint" id="input-hint">Ctrl+Enter to send</div>
</div>

<script>
// ── Session ID — "lg-" prefixed so this system's threads stay
// distinguishable from V1's session_ids if ever compared side by side ──
function generateSessionId() {
  const uuid = (crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
      });
  return 'lg-' + uuid;
}
function getSessionFromUrl() {
  const m = window.location.pathname.match(/^\/chat\/(lg-[\w-]+)$/);
  return m ? m[1] : null;
}
function pushSessionUrl(sid) {
  const url = `/chat/${sid}`;
  if (window.location.pathname !== url) history.pushState({ sessionId: sid }, '', url);
}

const _urlSessionId = getSessionFromUrl();
let sessionId = _urlSessionId || localStorage.getItem('trade_lg_session_id') || generateSessionId();
localStorage.setItem('trade_lg_session_id', sessionId);
if (!_urlSessionId) pushSessionUrl(sessionId);

let _busy = false;
// Set whenever /ask or /resume returns needs_clarification=true — the
// NEXT send goes to /resume instead of /ask, continuing the same paused
// graph run rather than starting a fresh one.
let _awaitingClarification = false;
// The LangGraph thread_id for the CURRENT in-flight question — distinct
// from sessionId. A fresh one comes back from every /ask; /resume must
// echo it back so the server resumes the right paused run.
let _currentRunId = null;

const messagesEl = document.getElementById('messages');
const emptyEl    = document.getElementById('empty-state');
const submitEl   = document.getElementById('submit');
const questionEl = document.getElementById('question');
const hintEl     = document.getElementById('input-hint');

function updateHeaderSid() {
  document.getElementById('header-sid').textContent = sessionId;
}

function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function appendBubble(role, content, opts = {}) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;
  const roleEl = document.createElement('div');
  roleEl.className = 'msg-role';
  roleEl.textContent = role === 'user' ? 'You' : 'Agent';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble' + (opts.clarify ? ' clarify' : '');
  if (role === 'assistant') {
    bubble.innerHTML = marked.parse(content || '');
  } else {
    bubble.textContent = content;
  }
  wrap.appendChild(roleEl);
  wrap.appendChild(bubble);
  if (opts.clarify) {
    const banner = document.createElement('div');
    banner.className = 'clarify-banner';
    banner.textContent = 'Waiting on your answer to continue';
    wrap.appendChild(banner);
  }
  const typing = messagesEl.querySelector('.typing-wrap');
  if (typing) messagesEl.insertBefore(wrap, typing);
  else messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return { bubble, wrap };
}

function showTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'msg assistant typing-wrap';
  const roleEl = document.createElement('div');
  roleEl.className = 'msg-role';
  roleEl.textContent = 'Agent';
  const b = document.createElement('div');
  b.className = 'typing';
  b.innerHTML = '<span></span><span></span><span></span>';
  wrap.appendChild(roleEl);
  wrap.appendChild(b);
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return wrap;
}
function hideTyping(el) { if (el && el.parentNode) el.parentNode.removeChild(el); }

questionEl.addEventListener('input', () => {
  questionEl.style.height = '44px';
  questionEl.style.height = Math.min(questionEl.scrollHeight, 160) + 'px';
  questionEl.style.overflowY = questionEl.scrollHeight > 160 ? 'auto' : 'hidden';
});

async function ask() {
  const text = questionEl.value.trim();
  if (!text || _busy) return;
  _busy = true;
  submitEl.disabled = true;
  questionEl.value = '';
  questionEl.style.height = '44px';
  if (emptyEl) emptyEl.style.display = 'none';
  appendBubble('user', text);
  const typingEl = showTyping();

  const wasResuming = _awaitingClarification;
  const url = wasResuming ? '/resume' : '/ask';
  const body = wasResuming
    ? { session_id: sessionId, run_id: _currentRunId, answer: text }
    : { question: text, session_id: sessionId };

  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    hideTyping(typingEl);
    if (!res.ok) throw new Error(`${res.status}`);
    const data = await res.json();

    if (data.error) throw new Error(data.error);

    _currentRunId = data.run_id;
    if (data.needs_clarification) {
      _awaitingClarification = true;
      appendBubble('assistant', data.clarify_question || 'Can you clarify?', { clarify: true });
      hintEl.textContent = 'Answering a clarifying question — Ctrl+Enter to send';
    } else {
      _awaitingClarification = false;
      appendBubble('assistant', data.answer || '(no answer returned)');
      hintEl.textContent = 'Ctrl+Enter to send';
    }
  } catch (err) {
    hideTyping(typingEl);
    const { bubble } = appendBubble('assistant', 'Something went wrong — try again.');
    bubble.classList.add('error');
  } finally {
    _busy = false;
    submitEl.disabled = false;
    questionEl.focus();
  }
}

function newChat() {
  sessionId = generateSessionId();
  localStorage.setItem('trade_lg_session_id', sessionId);
  pushSessionUrl(sessionId);
  _awaitingClarification = false;
  Array.from(messagesEl.children).forEach(el => { if (el !== emptyEl) el.remove(); });
  if (emptyEl) emptyEl.style.display = '';
  hintEl.textContent = 'Ctrl+Enter to send';
  updateHeaderSid();
  questionEl.focus();
}

updateHeaderSid();
questionEl.focus();

window.addEventListener('popstate', e => {
  const sid = (e.state && e.state.sessionId) || getSessionFromUrl();
  if (sid && sid !== sessionId) { sessionId = sid; localStorage.setItem('trade_lg_session_id', sid); updateHeaderSid(); }
  else if (!sid) newChat();
});

submitEl.addEventListener('click', ask);
questionEl.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) ask(); });
</script>
</body>
</html>
