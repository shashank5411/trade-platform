# ingestion/configs/sources/insiders.yaml
# SEC Form 4 insider trades ingestion config

default_start_date:
  dev:  "2020-01-01"
  prod: "2000-01-01"

frequency: quarterly   # Form 4 filings are continuous but we batch quarterly

# Dev companies — same as SEC EDGAR universe
# CIK mapping is hardcoded in ingest_insiders.py
tickers:
  - AAPL
  - MSFT
  - GOOGL
  - AMZN
  - JPM
  - BAC
  - XOM

# Transaction types to capture
# Table I only (non-derivative) — skip Table II (options/derivatives)
transaction_types:
  - P   # Open market purchase
  - S   # Open market sale
  - A   # Grant/award
  - D   # Disposition to issuer
  - F   # Payment of exercise price / tax withholding
  - M   # Exercise of derivative
  - G   # Gift

# EDGAR API config
api:
  base_url: "https://data.sec.gov"
  rate_limit_delay_seconds: 0.15   # 150ms — safely under 10 req/s EDGAR limit
  user_agent: "trade-platform/1.0 research@example.com"

schedule: "cron(0 8 1 1,4,7,10 ? *)"  # quarterly Jan/Apr/Jul/Oct 1st