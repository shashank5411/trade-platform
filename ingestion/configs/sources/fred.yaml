default_start_date:
  dev: "2020-01-01"
  prod: "2000-01-01"
frequency: monthly
max_lookback_days: 90

series:
  # Existing
  GDP:      gdp_billions_usd
  CPIAUCSL: cpi_all_urban
  FEDFUNDS: fed_funds_rate_pct
  UNRATE:   unemployment_rate_pct
  DGS10:    treasury_10yr_pct
  DGS2:     treasury_2yr_pct
  M2SL:     m2_money_supply_billions
  UMCSENT:  consumer_sentiment_index

  # Dollar and FX
  DTWEXBGS: dxy_broad_dollar_index     # Fed's own broad dollar index
  DEXUSEU:  usd_eur_rate               # USD per EUR
  DEXJPUS:  jpy_usd_rate               # JPY per USD
  DEXUSUK:  usd_gbp_rate               # USD per GBP
  DEXINUS:  usd_inr_rate               # INR per USD
  DEXCHUS:  usd_cny_rate               # CNY per USD

  # Commodities (FRED has these too — more reliable than futures)
  GOLDAMGBD228NLBM: gold_price_usd     # Gold London fixing
  DCOILWTICO:       oil_wti_price_usd  # WTI crude daily

  # Credit and spreads
  BAMLH0A0HYM2:     hy_credit_spread   # High yield spread — risk indicator
  T10Y2Y:           yield_curve_spread  # 10yr minus 2yr — recession signal
